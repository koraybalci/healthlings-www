- title: Fasting Timer
  description: Pick 16:8, 18:6, 20:4, OMAD or a custom window and start with one tap. The big friendly ring shows exactly where you are — and it survives restarts, because it runs on the clock, not the app.
  image: assets/images/hatchling_ring.png
  screenshot: assets/images/screen-fast.png
- title: Streaks & Nest Days
  description: Every completed fast grows your streak. Miss a day? A Nest Day is spent automatically to keep it safe — no punishing resets, and the day-by-day breakdown always shows exactly what counted.
  image: assets/images/hatchling.png
  screenshot: assets/images/screen-badges.png
- title: Progress You Can See
  description: A weight trend chart with your goal line, a fasting heatmap of your last 15 weeks, and optional body metrics (BMI, waist-to-height, body-fat estimate) explained in plain language.
  image: assets/images/hatchling_ring.png
  screenshot: assets/images/screen-progress.png
- title: Badges Worth Earning
  description: From your First Flight to Century Club — and the Comeback badge for getting back up after a broken streak, because coming back is the part that matters.
  image: assets/images/hatchling.png
- title: Kind by Design
  description: No guilt, no shame, no streak anxiety. A broken streak is a fresh start. Healthlings celebrates what you did, never scolds you for what you didn't.
  image: assets/images/hatchling_ring.png
- title: Private by Default
  description: Free, no ads, no account needed. Your data lives on your device — weight and body measurements are yours alone, full stop.
  image: assets/images/hatchling.png
  screenshot: assets/images/screen-profile.png
